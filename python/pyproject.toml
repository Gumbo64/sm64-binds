[project]
name = "sm64-binds"
version = "1.0.25"
authors = [
  { name="Gumbo64", email="gumbo64.uncoated526@passmail.net" },
]
description = "Mario 64 using WASM. Requires a US .z64 version ROM to work (8.00MB)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "wasmtime>=40.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://github.com/Gumbo64/sm64-binds"
repository = "https://github.com/Gumbo64/sm64-binds"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"sm64_binds.pkg" = ["*.xor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `sm64_binds` and `tests/conftest.py` importable from a source checkout,
# so `pytest` works without installing the package first.
pythonpath = ["src", "tests"]