[package]
name = "sm64-binds"
version = "1.0.20"
edition = "2024"

description = "Mario 64 using WASM. Requires a US .z64 version ROM to work (8.00MB)"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.219", features = ["derive"] }
sha1 = "0.10.6"
wasmer = { version = "6.1.0", default-features = false }
getrandom = { version = "0.3", features = ["wasm_js"] }
zip = "6.0.0"

[dev-dependencies]
plotters = "0.3"  # Example runtime dependency

[features]
default = ["wasmer/sys", "wasmer/cranelift", "fs"]
fs = []
wasm_js = ["wasmer/js-default"]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-nontrapping-float-to-int", "--enable-bulk-memory"]
